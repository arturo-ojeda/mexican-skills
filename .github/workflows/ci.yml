name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Syntax & static checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: node --check (todos los .js)
        run: |
          set -e
          while IFS= read -r f; do
            echo "checking $f"
            node --check "$f"
          done < <(find . -path ./node_modules -prune -o -name '*.js' -print)

      - name: bash -n (todos los .sh)
        run: |
          set -e
          while IFS= read -r f; do
            echo "checking $f"
            bash -n "$f"
          done < <(find . -path ./node_modules -prune -o -name '*.sh' -print)

  preflight:
    name: Preflight & self-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install buzon-tributario deps
        working-directory: buzon-tributario
        run: npm install --no-audit --no-fund

      - name: Install constancia-situacion-fiscal deps
        working-directory: constancia-situacion-fiscal
        run: npm install --no-audit --no-fund

      - name: buzon-tributario --preflight (espera fallo por env vars faltantes)
        working-directory: buzon-tributario
        run: |
          set +e
          out=$(node ./scripts/check-buzon.js --preflight)
          code=$?
          echo "$out"
          test "$code" -eq 2
          echo "$out" | node -e "let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{const d=JSON.parse(s); if(d.status!=='preflight_failed'){throw new Error('expected preflight_failed: '+s);}})"

      - name: constancia-situacion-fiscal --preflight (espera fallo por env vars faltantes)
        working-directory: constancia-situacion-fiscal
        run: |
          set +e
          out=$(node ./sat-flow.js --preflight)
          code=$?
          echo "$out"
          test "$code" -eq 2

      - name: constancia-situacion-fiscal --self-test (artifactsDir cae en CWD)
        run: |
          mkdir -p /tmp/work && cd /tmp/work
          out=$(node "$GITHUB_WORKSPACE/constancia-situacion-fiscal/sat-flow.js" --self-test)
          echo "$out"
          echo "$out" | node -e "let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{const d=JSON.parse(s); if(d.artifactsDir !== '/tmp/work/artifacts'){throw new Error('expected /tmp/work/artifacts, got '+d.artifactsDir);}})"

      - name: recibo-cfe --preflight (espera fallo por env vars faltantes)
        working-directory: recibo-cfe
        run: |
          set +e
          out=$(node ./download-recibo-cfe.js --preflight)
          code=$?
          echo "$out"
          test "$code" -eq 2

      - name: recibo-cfe --self-test
        working-directory: recibo-cfe
        run: node ./download-recibo-cfe.js --self-test

      - name: constancia-fiscal-extractor preflight (PDF inválido => exit 1)
        run: |
          set +e
          echo "not a pdf" > /tmp/notapdf.txt
          out=$(node ./constancia-fiscal-extractor/scripts/preflight.js /tmp/notapdf.txt)
          code=$?
          echo "$out"
          test "$code" -eq 1

      - name: constancia-fiscal-extractor validate.js (RFC genérico SAT)
        run: |
          out=$(echo '{"rfc":"xaxx010101000","nameOrBusinessName":"PUBLICO EN GENERAL","postalCode":"06100"}' | node ./constancia-fiscal-extractor/scripts/validate.js)
          echo "$out"
          echo "$out" | node -e "let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{const d=JSON.parse(s); if(d.rfc!=='XAXX010101000' || d.personaType!=='FISICA'){throw new Error(s);}})"
